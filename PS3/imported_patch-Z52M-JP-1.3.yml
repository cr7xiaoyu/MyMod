  "玩家攻防常驻 10 倍 (无视道具覆盖)":
    Games:
      "Sengoku Musou 2 with Moushouden HD":
        BLJM61092: [ All ]
    Author: "cr7xiaoyu"
    Notes: "1P/2P 攻防倍率常驻 10x，吃攻防道具不会降回 2x（修改末尾4位十六进制可调倍率）"
    Patch Version: 1.0
    Patch:
      # 玩家攻防倍率常驻 10x (0x3C804120 = 10.0f | 原版 1.0f = 0x3C803F80)
      # 其他倍率参考: 2x=0x3C804000 | 3x=0x3C804040 | 4x=0x3C804080 | 5x=0x3C8040A0
      - [ be32, 0x000AE0D8, 0x3C804120 ]
      # 吃攻击道具时保持 10x (2x=0x3D404000 | 3x=0x3D404040 | 4x=0x3D404080 | 5x=0x3D4040A0)
      - [ be32, 0x000AE200, 0x3D404120 ]
      # 吃防御道具时保持 10x
      - [ be32, 0x000AE228, 0x3D404120 ]

