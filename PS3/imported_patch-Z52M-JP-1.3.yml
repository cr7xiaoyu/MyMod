  "关卡结算获得金钱倍率 (默认10倍 / 改0x0a调倍率)":
    Games:
      "Sengoku Musou 2 with Moushouden HD":
        BLJM61092: [ All ]
    Author: "cr7xiaoyu"
    Notes: "修改每段第一行末尾的 0a 即可调整倍率：0a=10倍, 14=20倍, 32=50倍, 64=100倍"
    Patch Version: 1.0
    Patch:
      # 1. 1P 常规过关结算金钱倍率
      - [ be32, 0x00119B60, 0x1c630032 ] # mulli r3, r3, 10 (修改末尾 0a 调整倍率)
      - [ be32, 0x00119B68, 0x3c800098 ] # lis r4, 0x98     (上限 9,961,472 保护防溢出)

      # 2. 2P 双人过关结算金钱倍率
      - [ be32, 0x00119C94, 0x1c630032 ] # mulli r3, r3, 10 (修改末尾 0a 调整倍率)
      - [ be32, 0x00119C9C, 0x3c800098 ] # lis r4, 0x98     (上限 9,961,472 保护防溢出)

      # 3. 无限城模式过关结算金钱倍率
      - [ be32, 0x00119AB8, 0x1cc60032 ] # mulli r6, r6, 10 (修改末尾 0a 调整倍率)
      - [ be32, 0x00119AC0, 0x3c800098 ] # lis r4, 0x98     (上限 9,961,472 保护防溢出)
      
