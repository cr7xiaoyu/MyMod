  "关卡掉落武器生成8孔7空槽外加1条有效随机属性":
    Games:
      "Sengoku Musou 2 with Moushouden HD":
        BLJM61092: [ All ]
    Author: "cr7xiaoyu"
    Notes: "8孔全开，仅随机生成1条有效属性，数值强制20，其他7孔为空槽"
    Patch Version: 1.0
    Patch:
      # ==========================================
      # 修正版：关卡掉落武器强制 8 孔全开（不破坏寄存器与分支）
      # ==========================================
      - [ be32, 0x000AC208, 0x38800008 ] # li r4, 8 (原指令: 0x5483063E)
      - [ be32, 0x000AC210, 0x2C040008 ] # cmpwi r4, 8 (原指令: 0x2C030008，使原版 bge loc_AC31C 自然生效)
      # ==========================================
      # 属性生成循环限制为 1 轮（仅出 1 条技能属性，留 7 空孔）
      # ==========================================
      - [ be32, 0x000AC380, 0x2C030001 ] # cmpwi r3, 1 (原指令: 0x2C030004)
      # ==========================================
      # 唯一技能属性数值锁定 +20
      # ==========================================
      - [ be32, 0x000AC4E8, 0x60000000 ] # nop (原指令: 0x41800008)
      # 掉落武器 100% 必带随机元素特效（跳过 0=无属性）
      - [ be32, 0x000AC160, 0x38A00001 ] # li r5, 1 (原指令: 0x63650000)
      
  "锻造屋随机属性+20":
    Games:
      "Sengoku Musou 2 with Moushouden HD":
        BLJM61092: [ All ]
    Author: "cr7xiaoyu"
    Notes: "锻造屋生成的新属性的属性值为20，如需绑定全一样的属性，请开启第三条的选项B并同时注销属性A"
    Patch Version: 1.0
    Patch:    
      # ==========================================
      # 1. 同一属性允许最多填满全部 8 个槽位（解除原版最多 3 个同名属性的限制）
      # ==========================================
      - [ be32, 0x0012D05C, 0x2C030009 ] # cmpwi r3, 9 (原指令: 0x2C030003)
      # ==========================================
      # 2. 铁匠铺锻造数值强制 +20
      # ==========================================
      - [ be32, 0x0012D5D8, 0x60000000 ] # nop (取消 r4 = r3 覆盖，保留 li r4, 0x14；原指令: 0x60640000)
      # ==========================================
      # 3. 锻造新增属性控制（按需二选一，默认保留原版随机）
      # ==========================================
      # [选项 A] 保持原版随机属性（如需还原随机时启用）：
      - [ be32, 0x0012D04C, 0x57DE063E ] # clrlwi r30, r30, 24 (原始指令)
      # [选项 B] 锻造新增属性强制为指定类型（启用时请注释掉选项 A，并将 XX 改为 00~09 对应的属性编号）：
      # - [ be32, 0x0012D04C, 0x3BC00002 ] # li r30, 0x02 (示例 0x02；范围 0x00 ~ 0x09)
      
  "自由模式全关卡解锁（含全角色外传）":
