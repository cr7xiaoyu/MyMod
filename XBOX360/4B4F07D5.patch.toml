[[patch]]
    name = "玩家移动速度常驻 4 倍 (无需吃鞋 / 仅1P与2P生效)"
    desc = "100% 还原 PS3 原版逻辑：仅对 1P/2P 激活草鞋状态并 4 倍速，敌军/友军/小兵全原速"
    author = "cr7xiaoyu"
    is_enabled = true

    # 1. 无需吃鞋子道具：紧接在上方 0x82187F50 攻防写入之后，零冲突写入 1P/2P 速度上升状态
    #    (IDA 0x8218ED54 ~ 0x8218ED5C 减去 0x6E00 = 0x82187F54 ~ 0x82187F5C)
    [[patch.be32]]
        address = 0x82187F54
        value = 0x39400001 # li   r10, 1
    [[patch.be32]]
        address = 0x82187F58
        value = 0x99480011 # stb  r10, 0x11(r8)    (强制开启 1P/2P 速度状态 0xA9 = 1)
    [[patch.be32]]
        address = 0x82187F5C
        value = 0x60000000 # nop                 (跳过原版的 stw r10, 0xBC(r11)，完整保留状态标志位)

    # 2. 移动速度倍率 4x (IDA 0x82133E08 ~ 0x82133E1C 减去 0x6E00 = 0x8212D008 ~ 0x8212D01C)
    #    仅对上述 0xA9 == 1 的玩家生效，直接构造 40.0f 返回（零重定位干扰，不污染共享常量池）
    #    [其他倍率可选] 3x (32.0f): 0x3D604200 | 2.5x (28.0f): 0x3D6041E0
    [[patch.be32]]
        address = 0x8212D008
        value = 0x3D604220 # lis  r11, 0x4220        (40.0f = 4倍速)
    [[patch.be32]]
        address = 0x8212D00C
        value = 0x91610010 # stw  r11, 0x10(r1)
    [[patch.be32]]
        address = 0x8212D010
        value = 0xC0210010 # lfs  f1, 0x10(r1)
    [[patch.be32]]
        address = 0x8212D014
        value = 0x38210070 # addi r1, r1, 0x70
    [[patch.be32]]
        address = 0x8212D018
        value = 0x8181FFF8 # lwz  r12, -8(r1)
    [[patch.be32]]
        address = 0x8212D01C
        value = 0x7D8803A6 # mtlr r12 (紧接 0x8212D020 原有的 blr 返回)
		
# ==============================================================================
# 【过关结算金钱倍率】倍率自定义调整说明：
# 修改下方每组第一行 value 末尾的 2 位十六进制数值（默认 32 = 50倍）：
#   0x1D29000A  ->  10 倍 (0x0A = 10)
#   0x1D290014  ->  20 倍 (0x14 = 20)
#   0x1D290019  ->  25 倍 (0x19 = 25)
#   0x1D290032  ->  50 倍 (0x32 = 50，当前默认)
